<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin</title>
        <link rel="icon" type="image/x-icon" href="images/websiteLogo.png">
        <style>
            * { box-sizing: border-box; }
            body {
                margin: 0;
                background-image: url(images/backgroundAdmin.jpg);
                background-size: cover;
                background-attachment: fixed;
                color: #fff;
                font-family: Arial, sans-serif;
            }
            header {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
                justify-content: space-between;
                padding: 16px 24px;
                background: #022b3a;
            }
            header h1 { margin: 0; font-size: 1.3rem; }
            main { padding: 24px; max-width: 1100px; margin: 0 auto; }

            button {
                padding: 8px 14px;
                border: none;
                border-radius: 8px;
                background: #1f7a8c;
                color: #fff;
                cursor: pointer;
                font-size: 0.95rem;
            }
            button:hover { background: #2a9bb3; }
            button.danger { background: #a63d40; }
            button.danger:hover { background: #c94c50; }
            button.secondary { background: #444; }
            button.secondary:hover { background: #666; }

            .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
            .tabs button { background: #022b3a; }
            .tabs button.active { background: #1f7a8c; }

            .panel {
                background: #022b3a;
                border-radius: 14px;
                padding: 20px;
                margin-bottom: 24px;
            }
            .panel h2 { margin-top: 0; font-size: 1.1rem; }

            .panel-header {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 14px;
            }
            .panel-header h2 { margin: 0; }

            form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
            label { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; color: #9ad1e5; }
            label.wide { grid-column: 1 / -1; }
            input, select, textarea {
                padding: 8px;
                border-radius: 6px;
                border: 1px solid #1f7a8c;
                background: #011a24;
                color: #fff;
                font-size: 0.95rem;
                font-family: inherit;
            }
            textarea { resize: vertical; }
            .form-actions { grid-column: 1 / -1; display: flex; gap: 10px; }

            .table-wrap { overflow-x: auto; }
            table { width: 100%; border-collapse: collapse; }
            th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
            th { color: #9ad1e5; font-weight: normal; }
            td.actions { display: flex; gap: 8px; white-space: nowrap; }
            .empty { color: #888; padding: 10px 0; }

            #status { margin-left: 10px; color: #9ad1e5; font-size: 0.9rem; }

            /* Stars (collectibles) and tags */
            .stars { color: #ffc107; white-space: nowrap; }
            .tags { display: flex; flex-wrap: wrap; gap: 6px; }
            .tag {
                padding: 2px 10px;
                border-radius: 999px;
                font-size: 0.8rem;
                color: #fff;
            }
            .tag-kaizo { background: #c62828; }
            .tag-casual { background: #2e7d32; }
            .tag-default { background: #6b6b6b; }

            /* Profile picture */
            .avatarThumb {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                object-fit: cover;
                display: block;
                background: #011a24;
            }
            .imageMissing { color: #c94c50; font-size: 0.8rem; }
        </style>
    </head>
    <body>
        <header>
            <h1>Admin <span id="status"></span></h1>
            <div>
                <button id="downloadAllBtn">Download all JSON</button>
                <button id="resetBtn" class="secondary">Reload from files</button>
            </div>
        </header>

        <main>
            <nav class="tabs" id="tabs"></nav>

            <section class="panel">
                <h2 id="formTitle"></h2>
                <form id="entityForm"></form>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <h2 id="listTitle"></h2>
                    <button id="downloadOneBtn"></button>
                </div>
                <div class="table-wrap" id="tableWrap"></div>
            </section>
        </main>

        <script>
            // ====== Configuration ======
            // Real location of your JSON files (adjust if needed)
            const PATHS = {
                games: "json/games.json",
                runners: "json/runners.json",
                runs: "json/runs.json",
                ratings: "json/ratings.json",
            };
            const STORAGE_KEY = "adminData";
            const MAX_RATING = 10;

            // Description of each table: fields, primary key, displayed label
            const ENTITIES = {
                games: {
                    label: "Games",
                    file: "games.json",
                    idKey: "idGame",
                    display: (g) => g.name,
                    fields: [
                        { key: "name", label: "Name", type: "text", required: true },
                        { key: "description", label: "Description", type: "textarea" },
                        { key: "releaseDate", label: "Release date", type: "text" },
                        { key: "logo", label: "Logo (path)", type: "text" },
                        { key: "stars", label: "Stars to collect to finish the game", type: "stars",
                          min: 0, step: "1", placeholder: "120" },
                        { key: "tags", label: "Tags (comma-separated)", type: "tags",
                          placeholder: "kaizo, casual" },
                        { key: "downloadLink", label: "Download link", type: "text" },
                    ],
                },
                runners: {
                    label: "Runners",
                    file: "runners.json",
                    idKey: "idRunner",
                    display: (r) => r.username,
                    fields: [
                        { key: "username", label: "Username", type: "text", required: true },
                        { key: "avatar", label: "Profile picture (path or URL)", type: "image",
                          placeholder: "../images/avatars/alice.webp" },
                    ],
                },
                runs: {
                    label: "Runs",
                    file: "runs.json",
                    idKey: "idRuns",
                    display: (r) => `Run #${r.idRuns}`,
                    fields: [
                        { key: "category", label: "Category", type: "text", required: true },
                        { key: "time", label: "Time (hh:mm:ss.ms)", type: "text", required: true,
                          pattern: "\\d{2}:\\d{2}:\\d{2}(\\.\\d{1,3})?", placeholder: "00:12:34.560" },
                        { key: "completionDate", label: "Completion date", type: "date", required: true },
                        { key: "idRunner", label: "Runner", type: "ref", ref: "runners", required: true },
                        { key: "idGame", label: "Game", type: "ref", ref: "games", required: true },
                    ],
                },
                ratings: {
                    label: "Ratings",
                    file: "ratings.json",
                    idKey: "idRating",
                    display: (r) => `Rating #${r.idRating}`,
                    fields: [
                        { key: "value", label: `Rating (0 to ${MAX_RATING})`, type: "number", min: 0, max: MAX_RATING, step: "0.5", required: true },
                        { key: "comment", label: "Review (optional)", type: "textarea" },
                        { key: "idRunner", label: "Runner", type: "ref", ref: "runners", required: true },
                        { key: "idGame", label: "Game", type: "ref", ref: "games", required: true },
                    ],
                },
            };

            // ====== State ======
            let data = { games: [], runners: [], runs: [], ratings: [] };
            let current = "games";
            let editingId = null;

            const statusEl = document.getElementById("status");
            function setStatus(message) {
                statusEl.textContent = message ? `— ${message}` : "";
                if (message) setTimeout(() => (statusEl.textContent = ""), 3000);
            }

            // ====== Loading / saving ======
            async function loadFromFiles() {
                for (const key of Object.keys(PATHS)) {
                    const response = await fetch(PATHS[key]);
                    if (!response.ok) throw new Error(`Unable to load ${PATHS[key]}`);
                    data[key] = await response.json();
                }
                save();
            }

            function save() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (error) {
                    console.error("Unable to save locally", error);
                }
            }

            async function load() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        data = { ...data, ...JSON.parse(saved) };
                        return;
                    }
                } catch (error) {
                    console.error(error);
                }
                await loadFromFiles();
            }

            // Downloads a single JSON file (e.g. "games")
            function downloadOne(key) {
                const blob = new Blob([JSON.stringify(data[key], null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = ENTITIES[key].file;
                a.click();
                URL.revokeObjectURL(url);
            }

            // Downloads the 4 files, with a short delay between each
            function downloadAll() {
                Object.keys(ENTITIES).forEach((key, index) => {
                    setTimeout(() => downloadOne(key), index * 300);
                });
                setStatus("files downloaded");
            }

            // ====== Utilities ======
            function nextId(entityKey) {
                const idKey = ENTITIES[entityKey].idKey;
                return data[entityKey].reduce((max, item) => Math.max(max, item[idKey]), 0) + 1;
            }

            function refLabel(refKey, id) {
                const config = ENTITIES[refKey];
                const item = data[refKey].find((x) => x[config.idKey] === id);
                return item ? config.display(item) : `(deleted: ${id})`;
            }

            function removeItem(entityKey, id) {
                const idKey = ENTITIES[entityKey].idKey;
                data[entityKey] = data[entityKey].filter((x) => x[idKey] !== id);

                // Cascade deletion of linked data
                if (entityKey === "games" || entityKey === "runners") {
                    data.runs = data.runs.filter((x) => x[idKey] !== id);
                    data.ratings = data.ratings.filter((x) => x[idKey] !== id);
                }
            }

            // CSS class of a tag: kaizo = red, casual = green, others = grey
            function tagClass(tag) {
                const name = tag.toLowerCase();
                if (name === "kaizo") return "tag-kaizo";
                if (name === "casual") return "tag-casual";
                return "tag-default";
            }

            // Resolves an image path written in the JSON (e.g. "../images/a.webp")
            // relative to the location of the current tab's JSON file
            function resolveImage(path) {
                try {
                    const jsonUrl = new URL(PATHS[current], window.location.href);
                    return new URL(path, jsonUrl).href;
                } catch {
                    return path;
                }
            }

            // Fills a table cell according to the field type
            function fillCell(td, field, item) {
                const value = item[field.key];

                if (field.type === "ref") {
                    td.textContent = refLabel(field.ref, value);
                } else if (field.type === "stars") {
                    const count = Number(value);
                    if (Number.isFinite(count) && count > 0) {
                        const span = document.createElement("span");
                        span.className = "stars";
                        span.textContent = `${count} ★`;
                        td.append(span);
                    } else {
                        td.textContent = "—";
                    }
                } else if (field.type === "tags") {
                    const wrap = document.createElement("div");
                    wrap.className = "tags";
                    for (const tag of Array.isArray(value) ? value : []) {
                        const span = document.createElement("span");
                        span.className = `tag ${tagClass(tag)}`;
                        span.textContent = tag;
                        wrap.append(span);
                    }
                    td.append(wrap);
                } else if (field.type === "image") {
                    // Round thumbnail (profile picture)
                    const path = (value ?? "").toString().trim();
                    if (!path) {
                        td.textContent = "—";
                    } else {
                        const img = document.createElement("img");
                        img.className = "avatarThumb";
                        img.src = resolveImage(path);
                        img.alt = "";
                        img.addEventListener("error", () => {
                            const msg = document.createElement("span");
                            msg.className = "imageMissing";
                            msg.textContent = "Image not found";
                            img.replaceWith(msg);
                        });
                        td.append(img);
                    }
                } else if (field.type === "textarea") {
                    // Long text: truncated in the table
                    const text = (value ?? "").toString();
                    td.textContent = text.length > 60 ? text.slice(0, 60) + "…" : text || "—";
                } else {
                    td.textContent = value ?? "";
                }
            }

            // ====== Rendering ======
            function renderTabs() {
                const nav = document.getElementById("tabs");
                nav.replaceChildren();
                for (const key of Object.keys(ENTITIES)) {
                    const button = document.createElement("button");
                    button.textContent = ENTITIES[key].label;
                    if (key === current) button.className = "active";
                    button.addEventListener("click", () => {
                        current = key;
                        editingId = null;
                        render();
                    });
                    nav.append(button);
                }
            }

            function renderForm() {
                const config = ENTITIES[current];
                const form = document.getElementById("entityForm");
                const item = editingId !== null
                    ? data[current].find((x) => x[config.idKey] === editingId)
                    : null;

                document.getElementById("formTitle").textContent = item
                    ? `Edit (id ${editingId})`
                    : `Add — ${config.label}`;

                form.replaceChildren();

                for (const field of config.fields) {
                    const label = document.createElement("label");
                    label.textContent = field.label;

                    let input;
                    if (field.type === "ref") {
                        input = document.createElement("select");
                        const refConfig = ENTITIES[field.ref];
                        for (const option of data[field.ref]) {
                            const opt = document.createElement("option");
                            opt.value = option[refConfig.idKey];
                            opt.textContent = refConfig.display(option);
                            input.append(opt);
                        }
                    } else if (field.type === "textarea") {
                        input = document.createElement("textarea");
                        input.rows = 4;
                        if (field.placeholder) input.placeholder = field.placeholder;
                        label.classList.add("wide");
                    } else {
                        input = document.createElement("input");
                        // "stars" = number field, "tags" and "image" = text field
                        input.type = field.type === "stars" ? "number"
                            : (field.type === "tags" || field.type === "image") ? "text"
                            : field.type;
                        if (field.pattern) input.pattern = field.pattern;
                        if (field.placeholder) input.placeholder = field.placeholder;
                        if (field.min !== undefined) input.min = field.min;
                        if (field.max !== undefined) input.max = field.max;
                        if (field.step) input.step = field.step;
                    }

                    input.name = field.key;
                    input.required = !!field.required;

                    if (item) {
                        const value = item[field.key];
                        input.value = field.type === "tags"
                            ? (Array.isArray(value) ? value.join(", ") : "")
                            : value ?? "";
                    } else if (field.type === "stars") {
                        input.value = 0;
                    }

                    label.append(input);
                    form.append(label);
                }

                const actions = document.createElement("div");
                actions.className = "form-actions";

                const submit = document.createElement("button");
                submit.type = "submit";
                submit.textContent = item ? "Save" : "Add";
                actions.append(submit);

                if (item) {
                    const cancel = document.createElement("button");
                    cancel.type = "button";
                    cancel.className = "secondary";
                    cancel.textContent = "Cancel";
                    cancel.addEventListener("click", () => {
                        editingId = null;
                        render();
                    });
                    actions.append(cancel);
                }

                form.append(actions);
            }

            function renderTable() {
                const config = ENTITIES[current];
                const wrap = document.getElementById("tableWrap");
                document.getElementById("listTitle").textContent =
                    `${config.label} (${data[current].length})`;

                // Download button for the current tab's file
                const downloadOneBtn = document.getElementById("downloadOneBtn");
                downloadOneBtn.textContent = `Download ${config.file}`;
                downloadOneBtn.onclick = () => {
                    downloadOne(current);
                    setStatus(`${config.file} downloaded`);
                };

                wrap.replaceChildren();

                if (data[current].length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "empty";
                    empty.textContent = "No items.";
                    wrap.append(empty);
                    return;
                }

                const table = document.createElement("table");
                const headRow = document.createElement("tr");
                for (const title of ["ID", ...config.fields.map((f) => f.label), "Actions"]) {
                    const th = document.createElement("th");
                    th.textContent = title;
                    headRow.append(th);
                }
                const thead = document.createElement("thead");
                thead.append(headRow);
                table.append(thead);

                const tbody = document.createElement("tbody");
                for (const item of data[current]) {
                    const tr = document.createElement("tr");

                    const idCell = document.createElement("td");
                    idCell.textContent = item[config.idKey];
                    tr.append(idCell);

                    for (const field of config.fields) {
                        const td = document.createElement("td");
                        fillCell(td, field, item);
                        tr.append(td);
                    }

                    const actionsCell = document.createElement("td");
                    actionsCell.className = "actions";

                    const editBtn = document.createElement("button");
                    editBtn.textContent = "Edit";
                    editBtn.addEventListener("click", () => {
                        editingId = item[config.idKey];
                        renderForm();
                        window.scrollTo({ top: 0, behavior: "smooth" });
                    });

                    const deleteBtn = document.createElement("button");
                    deleteBtn.className = "danger";
                    deleteBtn.textContent = "Delete";
                    deleteBtn.addEventListener("click", () => {
                        const cascade = current === "games" || current === "runners"
                            ? "\nLinked runs and ratings will also be deleted (remember to download runs.json and ratings.json)."
                            : "";
                        if (!confirm(`Delete item ${item[config.idKey]}?${cascade}`)) return;
                        removeItem(current, item[config.idKey]);
                        save();
                        if (editingId === item[config.idKey]) editingId = null;
                        render();
                        setStatus("deleted");
                    });

                    actionsCell.append(editBtn, deleteBtn);
                    tr.append(actionsCell);
                    tbody.append(tr);
                }
                table.append(tbody);
                wrap.append(table);
            }

            function render() {
                renderTabs();
                renderForm();
                renderTable();
            }

            // ====== Events ======
            document.getElementById("entityForm").addEventListener("submit", (event) => {
                event.preventDefault();
                const config = ENTITIES[current];
                const formData = new FormData(event.target);

                const values = {};
                for (const field of config.fields) {
                    const raw = formData.get(field.key) ?? "";

                    if (field.type === "number" || field.type === "ref") {
                        values[field.key] = Number(raw);
                    } else if (field.type === "stars") {
                        // Whole number, minimum 0
                        values[field.key] = Math.max(0, Math.round(Number(raw) || 0));
                    } else if (field.type === "tags") {
                        // "kaizo, casual" -> ["kaizo", "casual"] (no duplicates)
                        values[field.key] = [...new Set(
                            raw.split(",").map((t) => t.trim()).filter(Boolean)
                        )];
                    } else {
                        values[field.key] = raw.trim();
                    }
                }

                if (editingId !== null) {
                    const item = data[current].find((x) => x[config.idKey] === editingId);
                    Object.assign(item, values);
                    setStatus("updated");
                } else {
                    data[current].push({ [config.idKey]: nextId(current), ...values });
                    setStatus("added");
                }

                editingId = null;
                save();
                render();
            });

            document.getElementById("downloadAllBtn").addEventListener("click", downloadAll);

            document.getElementById("resetBtn").addEventListener("click", async () => {
                if (!confirm("Discard local changes and reload the JSON files?")) return;
                try {
                    await loadFromFiles();
                    editingId = null;
                    render();
                    setStatus("reloaded");
                } catch (error) {
                    alert(error.message);
                }
            });

            // ====== Startup ======
            load()
                .then(render)
                .catch((error) => {
                    document.querySelector("main").textContent = "Loading error: " + error.message;
                    console.error(error);
                });
        </script>
    </body>
</html>
